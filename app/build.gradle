plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.dip.muracoro.comittont'
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.github.mikotomaniax.comittonxz"
       
        minSdkVersion 21
        targetSdkVersion 30
        
        versionCode (System.currentTimeMillis() / 1000) as Integer
        versionName "1.0." + ((System.currentTimeMillis() / 1000) as Integer)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['jcifs-1.3.17.jar'])
    
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
}
